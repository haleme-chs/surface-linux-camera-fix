# Read once when PipeWire loads the camera plugin. Restart PipeWire after
# a change:
#   systemctl --user try-restart pipewire pipewire-pulse wireplumber
#
# hflip=auto   mirror NV12 only when the DMI product name is "Surface Go 2"
# hflip=yes    mirror on this machine
# hflip=no     leave the picture as libcamera produced it
hflip=auto
